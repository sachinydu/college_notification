{% extends 'base.html' %}

{% block auth_content %}
<div class="erp-login-container">
  <div class="erp-login-wrapper">
    <!-- Header with Centered Logo -->
    <div class="erp-login-header">
      <div class="erp-header-center">
        <div class="erp-logo-circle">
          <i class="fas fa-university"></i>
        </div>
        <h1 class="erp-title">Login to Your Account</h1>
      </div>
    </div>

    <!-- Login Card -->
    <div class="erp-login-card">
      <div class="erp-card-body">

        <form method="POST" action="{{ url_for('login') }}">
          <!-- User Type Selection -->
          <div class="erp-role-section">
            <label class="erp-role-label">Select Your Role:</label>
            <div class="erp-role-buttons">
              <div class="erp-role-option">
                <input type="radio" class="erp-role-input" name="user_type" id="employee" value="employee" autocomplete="off" checked>
                <label class="erp-role-btn employee-role" for="employee">
                  <i class="fas fa-user-tie"></i>
                  <span>Employee</span>
                </label>
              </div>
              <div class="erp-role-option">
                <input type="radio" class="erp-role-input" name="user_type" id="student" value="student" autocomplete="off">
                <label class="erp-role-btn student-role" for="student">
                  <i class="fas fa-graduation-cap"></i>
                  <span>Student</span>
                </label>
              </div>
            </div>
          </div>

          <!-- Username/Identifier Field -->
          <div class="erp-form-group">
            <label for="identifier" class="erp-form-label">Username</label>
            <div class="erp-input-wrapper">
              <i class="fas fa-id-card erp-input-icon"></i>
              <input type="text" id="identifier" name="identifier" class="erp-form-control"
                     required placeholder="ERP ID / Roll No / Email / Mobile" autocomplete="off">
            </div>
            <small class="erp-helper-text">Enter your ERP ID, Roll Number, Email, or Mobile</small>
          </div>

          <!-- Password Field -->
          <div class="erp-form-group">
            <label for="password" class="erp-form-label">Password</label>
            <div class="erp-input-wrapper">
              <i class="fas fa-lock erp-input-icon"></i>
              <input type="password" id="password" name="password" class="erp-form-control"
                     required placeholder="Enter your password" autocomplete="current-password">
            </div>
          </div>

          <!-- Login Button -->
          <button type="submit" class="erp-login-btn">
            <i class="fas fa-sign-in-alt"></i>
            <span>Login to ERP</span>
          </button>
        </form>

        <!-- Forgot Password Link -->
        <div class="erp-login-footer">
          <a href="{{ url_for('forgot_password') }}" class="erp-forgot-link">
            <i class="fas fa-question-circle"></i>Reset Password
          </a>
        </div>

        <!-- Demo Credentials (Hidden by default) -->
        <div id="demo-credentials" class="erp-demo-credentials">
          <h6>Demo Credentials:</h6>
          <small>Admin: admin / admin123</small>
          <small>Faculty: faculty1 / faculty123</small>
          <small>Student: student1 / student123</small>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
// Toggle demo credentials
document.addEventListener('keydown', function(e) {
  if (e.ctrlKey && e.key === 'd') {
    e.preventDefault();
    const demo = document.getElementById('demo-credentials');
    demo.classList.toggle('erp-demo-visible');
  }
});
</script>
{% endblock %}
