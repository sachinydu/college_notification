{% extends 'base.html' %}

{% block content %}
<div class="container-fluid py-4">
  <div class="row justify-content-center">
    <div class="col-lg-8 col-xl-6">
      <div class="card shadow">
        <div class="card-header bg-warning text-dark">
          <h4 class="mb-0"><i class="fas fa-user-edit me-2"></i>Edit User</h4>
        </div>
        <div class="card-body p-4">
          <form method="POST" action="{{ url_for('edit_user', id=user.id) }}">
            <div class="row">
              <!-- Full Name -->
              <div class="col-md-6 mb-3">
                <label for="full_name" class="form-label fw-semibold">Full Name *</label>
                <input type="text" id="full_name" name="full_name" class="form-control" 
                       required placeholder="Enter full name" value="{{ user.full_name or '' }}">
              </div>

              <!-- Email -->
              <div class="col-md-6 mb-3">
                <label for="email" class="form-label fw-semibold">Email</label>
                <input type="email" id="email" name="email" class="form-control" 
                       placeholder="Enter email address" value="{{ user.email or '' }}">
              </div>
            </div>

            <div class="row">
              <!-- Roll Number -->
              <div class="col-md-6 mb-3">
                <label for="roll_no" class="form-label fw-semibold">Roll Number</label>
                <input type="text" id="roll_no" name="roll_no" class="form-control" 
                       placeholder="Enter roll number (for students)" value="{{ user.roll_no or '' }}">
              </div>

              <!-- Username (read-only) -->
              <div class="col-md-6 mb-3">
                <label for="username" class="form-label fw-semibold">Username</label>
                <input type="text" id="username" class="form-control" readonly 
                       value="{{ user.username }}" title="Username cannot be changed">
                <small class="text-muted">Username cannot be modified</small>
              </div>
            </div>

            <div class="row">
              <!-- Role -->
              <div class="col-md-4 mb-3">
                <label for="role" class="form-label fw-semibold">Role *</label>
                <select id="role" name="role" class="form-select" required onchange="toggleStudentFields()">
                  <option value="">Select Role</option>
                  <option value="student" {% if user.role == 'student' %}selected{% endif %}>Student</option>
                  <option value="faculty" {% if user.role == 'faculty' %}selected{% endif %}>Faculty</option>
                  <option value="admin" {% if user.role == 'admin' %}selected{% endif %}>Admin</option>
                </select>
              </div>

              <!-- Section (for students) -->
              <div class="col-md-4 mb-3 student-field" style="{% if user.role != 'student' %}display: none;{% endif %}">
                <label for="section" class="form-label fw-semibold">Section</label>
                <input type="text" id="section" name="section" class="form-control" 
                       placeholder="e.g., A, B, C" value="{{ user.section or '' }}">
              </div>

              <!-- Semester (for students) -->
              <div class="col-md-4 mb-3 student-field" style="{% if user.role != 'student' %}display: none;{% endif %}">
                <label for="semester" class="form-label fw-semibold">Semester</label>
                <select id="semester" name="semester" class="form-select">
                  {% for i in range(1, 9) %}
                  <option value="{{ i }}" {% if user.semester == i %}selected{% endif %}>Semester {{ i }}</option>
                  {% endfor %}
                </select>
              </div>
            </div>

            <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
              <a href="{{ url_for('manage_users') }}" class="btn btn-outline-secondary me-md-2">
                <i class="fas fa-times me-1"></i>Cancel
              </a>
              <button type="submit" class="btn btn-warning">
                <i class="fas fa-save me-1"></i>Update User
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap CSS and JS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
function toggleStudentFields() {
  const role = document.getElementById('role').value;
  const studentFields = document.querySelectorAll('.student-field');
  
  if (role === 'student') {
    studentFields.forEach(field => field.style.display = 'block');
  } else {
    studentFields.forEach(field => field.style.display = 'none');
  }
}

// Initialize on page load
document.addEventListener('DOMContentLoaded', function() {
  toggleStudentFields();
});
</script>
{% endblock %}
